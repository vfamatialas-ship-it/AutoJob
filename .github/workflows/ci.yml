name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint / Typecheck / Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式检查
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      # PRD §74：禁止跳过 TypeScript 类型检查
      - name: 类型检查
        run: pnpm typecheck

      # PRD §74：禁止为了让测试通过而删除失败测试
      - name: 单元测试
        run: pnpm test

      # 项目最重要的约束：真实个人信息绝不进仓库
      - name: 隐私审计
        run: pnpm privacy:check

      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps chromium

      # PRD §69：E2E 测试必须在 CI 中运行
      - name: E2E 测试（Mock 站点）
        run: pnpm test:e2e

      - name: 上传失败截图与 trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
