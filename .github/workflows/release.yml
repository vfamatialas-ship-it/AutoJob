name: Release

# 打标签时构建各平台安装包（PRD §63）。
# Linux 上开发，Windows 包由 GitHub 的 Windows runner 构建 ——
# 这是唯一可靠的方式：原生模块（better-sqlite3）必须在目标平台上编译。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: 'nsis,msi'
            label: Windows
          - platform: ubuntu-22.04
            target: 'deb,appimage'
            label: Linux

    runs-on: ${{ matrix.platform }}
    name: 构建 ${{ matrix.label }} 安装包

    steps:
      - uses: actions/checkout@v4

      # Linux 需要 Tauri 的系统依赖；Windows runner 自带 WebView2
      - name: 安装 Linux 系统依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            librsvg2-dev libayatana-appindicator3-dev libxdo-dev

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 质量闸门：不通过就不出包
      - name: 检查
        run: pnpm check

      - name: 打包 Worker 可执行文件
        run: node scripts/build-worker.mjs

      - name: 构建桌面端安装包
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: --bundles ${{ matrix.target }}

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: autojob-${{ matrix.label }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/**/*.exe
            apps/desktop/src-tauri/target/release/bundle/**/*.msi
            apps/desktop/src-tauri/target/release/bundle/**/*.deb
            apps/desktop/src-tauri/target/release/bundle/**/*.AppImage
          retention-days: 30
