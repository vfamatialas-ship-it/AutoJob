[package]
name = "autojob-desktop"
version = "0.0.1"
description = "AutoJob 秋招助手"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# 体积优先：桌面工具不需要极致性能，安装包小一点用户更愿意装
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
